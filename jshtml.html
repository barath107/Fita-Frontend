"<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1"></p>
    <p id="p2"></p>

    <p class="p3">class p tag</p>
    <p class="p3">class p1 tag</p>
    <p class="p3">class p2 tag</p>
    <div id="d1">

    </div>

    <p id="hi"></p>
    <script>
        document.getElementById("p1").innerText = "Hello, World!";
        // document.getElementById("hi").innerHTML = "<b> hI I AM BHARATH </b>";
        console.log(document.getElementById("p1").textContent);
        document.getElementById("p2").innerText=document.getElementById("p1").textContent;

        for(let i=0;i<5;i++){
            let newPtag = document.createElement("p");
            newPtag.innerText = "New Tag from JS";
            document.getElementById("d1").append(newPtag);
        }

        document.getElementById("p2").remove();

        let ptags = document.getElementsByClassName("p3");
        for(let index = 0;index<ptags.length;index++){
            ptags[index].style.color="yellow";
        }
    </script>

</body>
</html>
